<head>

    <style>
        body {
            background-color: #131314;
            color: #e5e2e3;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .orb-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
            pointer-events: none;
        }

        .pulse-dot {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 240, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 240, 255, 0);
            }
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="orb-glow"></div>
    <!-- Top App Bar (Semantic Shell: Suppressed nav for linear/task page, replaced with back action) -->
    <header
        class="fixed top-0 w-full z-50 bg-background/50 backdrop-blur-xl flex items-center justify-between px-safe-margin h-16">
        <button class="text-on-surface hover:text-primary transition-colors flex items-center gap-2 group">
            <span
                class="material-symbols-outlined text-[20px] font-light transition-transform group-hover:-translate-x-1">arrow_back</span>
            <span class="font-label-caps text-label-caps">BACK</span>
        </button>
        <div class="font-headline-lg-mobile text-headline-lg-mobile tracking-widest text-primary font-bold">JARVIS</div>
        <div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden border border-outline/20">
            <img alt="User Profile" class="w-full h-full object-cover"
                data-alt="A highly detailed, cinematic close-up of a sophisticated digital avatar profile picture in a dark futuristic aesthetic. The image features deep obsidian blacks and a subtle glowing cyan aura. The avatar appears elegant, minimal, and hyper-intelligent, fitting perfectly into a premium AI operating system interface. Professional studio lighting."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0PQF1NmKhLZFb4FYIic7q3zWnAJtU6d4vEl9NM_3z3oJM39roJF2-eWqKdSXjvditAWW9w0Nrws1cc0bFZrvcyyi3NB654rCNgIfDbHuxE-Vkkn4OEGe7mt74Q38QeZ7O802g63IByEGojuo1K2UWeWSZ2BoSo3f7ay6RY09_0CtczCKWgbEJw79uu4clHjEKDptyCYjQTnWK4z_qXTRP7DX9plnW-wEOrSO-ivNaH46nwvLxi4gaVQ" />
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="flex-1 pt-24 px-safe-margin pb-32 flex flex-col gap-stack-lg max-w-4xl mx-auto w-full">
        <!-- Header Section -->
        <section class="flex flex-col gap-stack-sm items-center text-center mt-8">
            <div class="font-label-caps text-label-caps text-primary tracking-widest mb-2 flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-primary pulse-dot"></div>
                WAITING FOR CONTEXT
            </div>
            <h1 class="font-display-lg text-display-lg text-on-surface">Buy sunscreen</h1>
            <p class="font-body-xl text-body-xl text-on-surface-variant max-w-lg mx-auto mt-4">
                This reminder will trigger automatically when you enter the specified proximity zone.
            </p>
        </section>
        <!-- Details Grid (Bento Style) -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full">
            <!-- Trigger Card -->
            <div
                class="glass-panel rounded-DEFAULT p-container-padding flex flex-col gap-4 relative overflow-hidden group">
                <div
                    class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary font-light"
                        style="font-variation-settings: 'FILL' 1;">location_on</span>
                    <h3 class="font-label-caps text-label-caps text-on-surface-variant">TRIGGER CONDITION</h3>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Beach Proximity
                    </div>
                    <div class="font-body-md text-body-md text-outline">Radius: 2.5km from coastline</div>
                </div>
            </div>
            <!-- Action Card -->
            <div class="glass-panel rounded-DEFAULT p-container-padding flex flex-col gap-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary font-light">shopping_cart</span>
                    <h3 class="font-label-caps text-label-caps text-on-surface-variant">INTENT</h3>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                    <div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">Purchase Item
                    </div>
                    <div class="font-body-md text-body-md text-outline">Priority: High (SPF 50+)</div>
                </div>
            </div>
            <!-- Map Visualization -->
            <div
                class="glass-panel rounded-lg p-1 md:col-span-2 relative h-64 overflow-hidden border border-outline/10">
                <!-- Abstract map representation instead of literal map image for aesthetic -->
                <div class="absolute inset-0 bg-[url('placeholder')] bg-cover bg-center opacity-40 mix-blend-luminosity"
                    data-alt="A highly abstract, futuristic dark mode map visualization. Deep obsidian background with subtle glowing cyan contour lines representing coastal topography. Minimalist aesthetic, sophisticated operating system style. Thin, precise glowing elements indicating an active zone, feeling like a premium intelligence interface rather than a standard consumer map app.">
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background/50"></div>
                <!-- Target Indicator -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
                    <div
                        class="w-32 h-32 rounded-full border border-primary/30 bg-primary/5 flex items-center justify-center animate-[pulse_4s_ease-in-out_infinite]">
                        <div
                            class="w-16 h-16 rounded-full border border-primary/50 bg-primary/10 flex items-center justify-center">
                            <div class="w-3 h-3 rounded-full bg-primary shadow-[0_0_15px_rgba(0,240,255,0.8)]"></div>
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-4 left-6 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-sm font-light">my_location</span>
                    <span class="font-label-caps text-label-caps text-on-surface-variant">COORDINATES LOCKED</span>
                </div>
            </div>
        </section>
        <!-- Actions -->
        <section class="flex justify-center gap-4 mt-8">
            <button
                class="px-8 py-4 rounded-full border border-outline/30 text-on-surface font-label-caps text-label-caps hover:bg-surface-bright transition-colors">
                EDIT TRIGGER
            </button>
            <button
                class="px-8 py-4 rounded-full bg-primary/10 border border-primary/50 text-primary font-label-caps text-label-caps hover:bg-primary/20 transition-colors shadow-[0_0_20px_rgba(0,240,255,0.1)]">
                CANCEL REMINDER
            </button>
        </section>
    </main>
    <!-- Bottom Nav Bar suppressed due to this being a Detail/Transactional page (Semantic Shell Mandate) -->
</body>

</html>
